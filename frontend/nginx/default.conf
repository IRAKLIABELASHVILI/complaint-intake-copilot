# Serves the built front end and forwards /api to the backend, so the browser talks to one
# origin only: no CORS configuration exists, because none is needed.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # /api/cases -> http://api:8000/cases
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;  # a complaint is at most 50 000 characters
    }

    # Built files have a content hash in their name: they can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app; the router reads the path in the browser.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
