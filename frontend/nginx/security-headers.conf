# Included in every location: an add_header inside a location replaces ALL inherited ones,
# so declaring these once at server level would silently drop them wherever caching is set.

# Only our own files may load or run: an injected <script> or inline handler is blocked even if
# some text were ever rendered as HTML. No inline styles or scripts are needed by the build.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
