name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cic
          POSTGRES_PASSWORD: cic
          POSTGRES_DB: cic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cic -d cic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cic:cic@localhost:5432/cic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests on SQLite
        run: pytest

      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cic:cic@localhost:5432/cic
        run: pytest
