services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cic
      POSTGRES_PASSWORD: cic
      POSTGRES_DB: cic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cic -d cic"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cic:cic@db:5432/cic
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
